[project]
name = "fin-tracing"
version = "0.1.0"
description = "Manual OpenInference/OpenTelemetry tracing helpers shared by every service"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "openinference-semantic-conventions>=0.1.41",
    "openinference-instrumentation>=0.1.70",
    "anthropic>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_tracing"]
