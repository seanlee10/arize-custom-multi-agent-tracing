[project]
name = "decision-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fin-tracing",
    "anthropic>=1.11,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "yfinance>=1.7",
]

[tool.uv.sources]
fin-tracing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_agent"]
