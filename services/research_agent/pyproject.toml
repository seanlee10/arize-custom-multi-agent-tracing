[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fin-tracing",
    "anthropic>=1.11,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[tool.uv.sources]
fin-tracing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
